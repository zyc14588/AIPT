name: AIPT M0 CI

on:
  push:
    branches:
      - main
      - "task/**"
      - "repair/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aipt-m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Retroactively validate the fixed historical B000 merge commit using
  # B001's own validators, against a temporary read-only expansion.
  # ------------------------------------------------------------------
  b000-retro:
    name: b000-retro (fixed B000 commit, read-only expansion)
    runs-on: ubuntu-26.04
    steps:
      - name: Record runner environment (evidence)
        run: |
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "GITHUB_REF=$GITHUB_REF GITHUB_SHA=$GITHUB_SHA"
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          grep -E '^(NAME|PRETTY_NAME|VERSION|VERSION_ID|ID)=' /etc/os-release || true
          uname -a
      - name: Checkout B001 candidate (full history for the fixed B000 commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup exact Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Verify exact Node.js version
        run: |
          test "$(node --version)" = "v24.19.0"
          node --version
      - name: B000 retro validation (fixed commit + fixed expected tree)
        run: >-
          node scripts/ci/validate/b000-retro.mjs
          --repo .
          --commit 777a3f39ba78c1ef3168597890c61abf7a55d962
          --expected-tree f5f845b860ba0944ef104b4679fa074ad6efecbb

  # ------------------------------------------------------------------
  # Exact toolchain qualification on GA and reference runner images,
  # plus the explicit B002 protocol, B004 runtime-shell, and B005 Harness
  # Adapter, B006 Evidence, and B007 Web gates on every matrix runner.
  # ------------------------------------------------------------------
  toolchain:
    name: toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
    steps:
      - name: Record runner environment (evidence)
        run: |
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "GITHUB_REF=$GITHUB_REF GITHUB_SHA=$GITHUB_SHA"
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          grep -E '^(NAME|PRETTY_NAME|VERSION|VERSION_ID|ID)=' /etc/os-release || true
          uname -a
      - name: Checkout candidate (full history for retro replay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup exact Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - name: Verify exact Go version
        run: |
          test "$(go version)" = "go version go1.26.6 linux/amd64"
          go version
      - name: Setup exact Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Verify exact Node.js version
        run: |
          test "$(node --version)" = "v24.19.0"
          node --version
      - name: Install exact pnpm 11.4.0
        run: |
          npm install --global --no-audit --no-fund pnpm@11.4.0
          test "$(pnpm --version)" = "11.4.0"
          pnpm --version
      - name: gofmt check
        run: |
          test -z "$(gofmt -l .)"
          echo "gofmt clean"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Keep generated pnpm links outside candidate source scope
        run: |
          test -z "$(git ls-files -- 'node_modules/**' ':(glob)**/node_modules/**')"
          printf '%s\n' '# CI-local generated dependency metadata' 'node_modules/' >> .git/info/exclude
      - name: pnpm frozen install
        run: pnpm install --frozen-lockfile
      - name: Execute and fingerprint exact Authority Amendment bootstrap defects
        id: authority_amendment_classify
        run: node scripts/ci/validate/p1-b000-authority-amendment.mjs --ci-bootstrap-classify --github-output "${GITHUB_OUTPUT}"
      - name: Authority Amendment schema provenance closeout fingerprints and A01-A20 R01-R20 gate
        if: steps.authority_amendment_classify.outputs.applicable == 'true'
        run: pnpm run check:p1-b000-authority-amendment
      - name: Authority Amendment-002 predecessor preservation delta and A2-N01-N30 gate
        run: pnpm run check:p1-b000-authority-amendment-002
      - name: Authority Amendment-002 exact frozen UNREGISTERED predecessor P0 gates
        run: |
          A2_PREDECESSOR_TARGET="${RUNNER_TEMP}/a2-unregistered-predecessor"
          git clone --no-checkout https://github.com/zyc14588/UNREGISTERED.git "${A2_PREDECESSOR_TARGET}"
          git -C "${A2_PREDECESSOR_TARGET}" checkout --detach "358d6d9d08a86818e34fd0c0d9a62bfe66e73abe"
          test "$(git -C "${A2_PREDECESSOR_TARGET}" rev-parse HEAD)" = "358d6d9d08a86818e34fd0c0d9a62bfe66e73abe"
          test "$(git -C "${A2_PREDECESSOR_TARGET}" rev-parse 'HEAD^{tree}')" = "5585271c78d1fe5cd8357c7b36a501bee34f0240"
          test -z "$(git -C "${A2_PREDECESSOR_TARGET}" status --porcelain=v1 --untracked-files=all)"
          node scripts/ci/validate/p1-b000-authority-amendment-002.mjs --require-predecessor --predecessor-checkout "${A2_PREDECESSOR_TARGET}"
      - name: "B002 protocol assets: schema + JSON-RPC wire envelopes + shared fixture (hidden-leak mutant rejection, replay determinism)"
        run: pnpm run check:protocol-assets
      - name: B002 Adapter SDK contract tests (packages/adapter-sdk)
        run: pnpm run test:adapter-sdk
      - name: B002 Go fixture contract tests (internal/protocol; shared fixture + replay determinism)
        run: pnpm run test:protocol-go
      - name: "B004 runtime shell: fixed gate order + config + Core + Launcher + CLI mutation probes"
        run: pnpm run check:runtime-shell
      - name: "B005 Harness Adapter contract: thin stdio runtime + security mutation probes"
        run: pnpm run check:harness-adapter
      - name: B005 Harness Adapter real-child stdio smoke tests
        run: pnpm run test:harness-adapter
      - name: "B006 Evidence schema + RAW_CAPTURE contract + security mutation probes"
        run: pnpm run check:evidence
      - name: "B006 Evidence Go exporter/verifier deterministic and tamper tests"
        run: pnpm run test:evidence-go
      - name: "B007 strict Web validator: loopback Host/Origin/CSRF + six truthful panels + embedded artifact"
        run: pnpm run check:web-ui
      - name: B007 TypeScript Dashboard contract tests (Node 24 native type stripping)
        run: pnpm run test:web-ui
      - name: B007 Go Web Host unit and security tests
        run: pnpm run test:web-go
      - name: B007 live loopback Web smoke test (dynamic 127.0.0.1 port)
        run: pnpm run smoke:web-ui
      - name: B008 M0 Development Pass final gate (MERGED_CLOSED + boundary probes)
        if: steps.authority_amendment_classify.outputs.applicable != 'true'
        run: pnpm run check:m0-development-pass
      - name: AIPT MVP B001 Test Plan + immutable Manifest + PostgreSQL queue/lease gate
        if: steps.authority_amendment_classify.outputs.applicable != 'true'
        run: pnpm run check:mvp-b001
      - name: AIPT MVP B000 bootstrap gate
        if: steps.authority_amendment_classify.outputs.applicable != 'true'
        run: pnpm run check:mvp-bootstrap
      - name: P1 B000 authority contract schemas scope lifecycle and N01-N39 gate
        if: steps.authority_amendment_classify.outputs.applicable != 'true'
        run: pnpm run check:p1-b000-authority
      - name: P1 B000 Authority post-merge repair F1 F2 supersession and S01-S10 gate
        if: steps.authority_amendment_classify.outputs.applicable != 'true'
        run: pnpm run check:p1-b000-authority-repair
      - name: P1 B000 Base Authority formal evidence and governance-only closeout gate
        if: steps.authority_amendment_classify.outputs.applicable != 'true'
        run: pnpm run check:p1-b000-authority-closeout
      - name: MVP-B001+B001+B002+B003+B004+B005+B006+B007+B008 aggregate validators (pnpm run check)
        if: steps.authority_amendment_classify.outputs.applicable != 'true'
        run: pnpm run check
      - name: Exact Base Authority candidate-stage post-merge reverification
        if: steps.authority_amendment_classify.outputs.applicable != 'true'
        run: pnpm run check:p1-b000-post-merge-reverification
      - name: PostgreSQL Official Image digest pull/run (exact 18.4)
        run: |
          docker pull "postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636"
          PG_VERSION="$(docker run --rm "postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636" postgres --version)"
          echo "postgres --version => ${PG_VERSION}"
          case "${PG_VERSION}" in
            "postgres (PostgreSQL) 18.4"*) ;;
            *) echo "unexpected postgres version: ${PG_VERSION}"; exit 1 ;;
          esac
          REPO_DIGESTS="$(docker image inspect "postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636" --format '{{join .RepoDigests ","}}')"
          echo "RepoDigests: ${REPO_DIGESTS}"
          case "${REPO_DIGESTS}" in
            *"sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636"*) ;;
            *) echo "pinned multi-arch digest not reported in RepoDigests"; exit 1 ;;
          esac

  # ------------------------------------------------------------------
  # R4-Q023 supply-chain gates.
  # ------------------------------------------------------------------
  supply-chain:
    name: supply-chain (R4-Q023 gates)
    runs-on: ubuntu-26.04
    steps:
      - name: Record runner environment (evidence)
        run: |
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "GITHUB_REF=$GITHUB_REF GITHUB_SHA=$GITHUB_SHA"
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          grep -E '^(NAME|PRETTY_NAME|VERSION|VERSION_ID|ID)=' /etc/os-release || true
          uname -a
      - name: Checkout candidate (full history for provenance)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup exact Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - name: Setup exact Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install exact pnpm 11.4.0
        run: |
          npm install --global --no-audit --no-fund pnpm@11.4.0
          test "$(pnpm --version)" = "11.4.0"
      - name: Frozen install (lock integrity)
        run: pnpm install --frozen-lockfile
      - name: Supply-chain policy / pins / license coverage / secret-free scan
        run: node scripts/ci/validate/supply-chain.mjs
      - name: Go module tidy clean (lock integrity)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          echo "go.mod / go.sum tidy-clean"
      - name: Go vulnerability scan (govulncheck, exact pinned tool)
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "${RUNNER_TEMP}/bin/govulncheck" -version
          "${RUNNER_TEMP}/bin/govulncheck" ./...
      - name: pnpm audit
        run: pnpm audit
      - name: Deterministic SBOM (generate twice, byte-identical, SHA-256)
        run: node scripts/ci/validate/sbom.mjs
      - name: Source provenance metadata
        run: node scripts/ci/provenance.mjs

  # ------------------------------------------------------------------
  # AIPT-M0-B003 storage + B004 runtime-shell + B006 Evidence integration against
  # ephemeral PostgreSQL 18.4.
  # A fresh container is started per run from the exact multi-arch
  # digest, published ONLY on the loopback interface (127.0.0.1:5432),
  # fed a test-only DSN (dbname=postgres, no credentials), verified to
  # report 18.4, and removed after the tests. Production PostgreSQL is
  # never touched; the integration commands hard-enable
  # AIPT_REQUIRE_POSTGRES_INTEGRATION=1 so a missing/invalid test
  # boundary fails the job instead of skipping.
  # ------------------------------------------------------------------
  storage-postgres:
    name: storage-postgres (ephemeral PostgreSQL 18.4 integration)
    runs-on: ubuntu-26.04
    steps:
      - name: Record runner environment (evidence)
        run: |
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "GITHUB_REF=$GITHUB_REF GITHUB_SHA=$GITHUB_SHA"
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          grep -E '^(NAME|PRETTY_NAME|VERSION|VERSION_ID|ID)=' /etc/os-release || true
          uname -a
      - name: Checkout candidate (full history for integration sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup exact Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - name: Setup exact Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Verify exact Go version
        run: |
          test "$(go version)" = "go version go1.26.6 linux/amd64"
          go version
      - name: Verify exact Node.js version
        run: |
          test "$(node --version)" = "v24.19.0"
          node --version
      - name: Start ephemeral PostgreSQL 18.4 container (digest-pinned, loopback-only)
        run: |
          docker pull "postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636"
          docker run --rm --name aipt-pg-18.4 -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:5432:5432 -d "postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636"
      - name: Verify PostgreSQL 18.4 readiness and server version
        run: |
          for i in $(seq 1 60); do
            if docker exec aipt-pg-18.4 pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec aipt-pg-18.4 pg_isready -U postgres -d postgres
          PG_VERSION="$(docker exec aipt-pg-18.4 postgres --version)"
          echo "postgres --version => ${PG_VERSION}"
          case "${PG_VERSION}" in
            "postgres (PostgreSQL) 18.4"*) ;;
            *) echo "unexpected postgres version: ${PG_VERSION}"; exit 1 ;;
          esac
          SERVER_VERSION="$(docker exec aipt-pg-18.4 psql -U postgres -d postgres -tAc 'SHOW server_version')"
          echo "server_version => ${SERVER_VERSION}"
          case "${SERVER_VERSION}" in
            "18.4"*) ;;
            *) echo "unexpected server_version: ${SERVER_VERSION}"; exit 1 ;;
          esac
      - name: PostgreSQL integration tests (B003 ledger + MVP-B001 queue/lease + frozen-Base B004 runtime shell + B006 Evidence, test-only DSN)
        run: |
          export AIPT_POSTGRES_DSN="postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable"
          export AIPT_REQUIRE_POSTGRES_INTEGRATION=1
          go test ./internal/storage/postgres -run '^TestPostgresIntegration' -count=1 -v
          node scripts/ci/validate/mvp-b001.mjs --historical-launcher-integration
          go test ./internal/evidence -run '^TestPostgresIntegrationEvidence' -count=1 -v
      - name: PostgreSQL integration race coverage (B003 ledger + MVP-B001 WIP1/lease + frozen-Base B004 runtime shell + B006 Evidence)
        run: |
          export AIPT_POSTGRES_DSN="postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable"
          export AIPT_REQUIRE_POSTGRES_INTEGRATION=1
          go test -race ./internal/storage/postgres -run '^TestPostgresIntegration(MigrationConcurrentRunners|LedgerConcurrentSameStreamAppends|QueueConcurrentFormalClaimsWIP1|QueueLeaseHeartbeatExpiryRecoveryAndStaleHolder)$' -count=1 -v
          node scripts/ci/validate/mvp-b001.mjs --historical-launcher-integration --race
          go test -race ./internal/evidence -run '^TestPostgresIntegrationEvidence' -count=1 -v
      - name: Remove ephemeral PostgreSQL container (CI-only cleanup, never production)
        run: |
          if docker inspect aipt-pg-18.4 >/dev/null 2>&1; then
            docker rm -f aipt-pg-18.4
          fi
