<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AIPT — Local dashboard</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
