# AIPT pnpm workspace.
#
# B002 iteration 4 registers the first-party dependency-free TypeScript
# Adapter SDK: packages/adapter-sdk (@aipt/adapter-sdk 1.0.0, Node 24 native
# erasable TypeScript). Both workspace importers (the private root package and
# packages/adapter-sdk) carry ZERO dependency specifiers, and pnpm-lock.yaml
